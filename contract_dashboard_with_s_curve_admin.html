<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Management Dashboard & S-Curve - สอ.กฝร.</title>
    
    <!-- React & ReactDOM (Using React 18) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Recharts Dependencies (For S-Curve) - Using specific working version -->
    <script src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0fdf4; /* Light green tint bg */ }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%); }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        input[type="date"], input[type="number"], input[type="text"] {
            font-family: 'Sarabun', sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // Destructure Recharts
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        // Default Data representing the original Excel State
        const initialSettings = {
            contractNo: "1/2568",
            projectName: "สัญญาจ้างพัฒนาโปรแกรมระบบบริหารงานสหกรณ์และอนุญาตให้ใช้สิทธิในโปรแกรมบริหารงานสหกรณ์",
            contractor: "บริษัท โซแอ็ท โซลูชั่น จำกัด",
            budget: 6955000,
            guarantee: 347750,
            penaltyPerDay: 6955,
            committee: "ชุดที่ 2 (ปัจจุบัน)",
            currentDate: "2026-07-17" // Fixed context date from Excel
        };

        const initialTasks = [
            { period: 1, name: "งวดงานที่ 1", percent: 10, amount: 695500, startDate: "2025-07-25", endDate: "2026-01-20", status: "Completed", actualDate: "2026-02-13", planDays: 180, actualDays: 203 },
            { period: 2, name: "งวดงานที่ 2", percent: 15, amount: 1043250, startDate: "2026-01-21", endDate: "2026-09-22", status: "Pending", actualDate: "", planDays: 425, actualDays: "" },
            { period: 3, name: "งวดงานที่ 3", percent: 15, amount: 1043250, startDate: "2026-09-23", endDate: "2026-10-23", status: "Pending", actualDate: "", planDays: 456, actualDays: "" },
            { period: 4, name: "งวดงานที่ 4", percent: 15, amount: 1043250, startDate: "2026-10-24", endDate: "2027-03-25", status: "Pending", actualDate: "", planDays: 609, actualDays: "" },
            { period: 5, name: "งวดงานที่ 5", percent: 15, amount: 1043250, startDate: "2027-03-26", endDate: "2027-04-25", status: "Pending", actualDate: "", planDays: 640, actualDays: "" },
            { period: 6, name: "งวดงานที่ 6", percent: 15, amount: 1043250, startDate: "2027-04-26", endDate: "2027-05-23", status: "Pending", actualDate: "", planDays: 668, actualDays: "" },
            { period: 7, name: "งวดงานที่ 7", percent: 15, amount: 1043250, startDate: "2027-05-24", endDate: "2027-07-24", status: "Pending", actualDate: "", planDays: 730, actualDays: "" },
        ];

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(amount);
        };

        const formatThaiDate = (isoString) => {
            if(!isoString) return "-";
            const d = new Date(isoString);
            if(isNaN(d.getTime())) return "-";
            const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            return `${d.getDate()} ${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`;
        };

        // Calculation for S-Curve Generation (Translating Excel Logic to JS)
        const generateChartData = (tasks, currentDateStr) => {
            const points = [];
            if (!tasks || tasks.length === 0) return points;
            
            const projStart = new Date(Math.min(...tasks.map(t => new Date(t.startDate).getTime())));
            const projEnd = new Date(Math.max(...tasks.map(t => new Date(t.endDate).getTime())));
            const currentContext = new Date(currentDateStr).getTime();
            
            let currYear = projStart.getFullYear();
            let currMonth = projStart.getMonth();
            const endYear = projEnd.getFullYear();
            const endMonth = projEnd.getMonth();

            while (currYear < endYear || (currYear === endYear && currMonth <= endMonth)) {
                const pointDate = new Date(currYear, currMonth + 1, 0); // End of month
                const pTime = pointDate.getTime();
                
                let plannedCumulative = 0;
                let actualCumulative = 0;
                
                tasks.forEach(t => {
                    const tStart = new Date(t.startDate).getTime();
                    const tEnd = new Date(t.endDate).getTime();
                    
                    // Cumulative Planned Progress
                    if (pTime >= tEnd) {
                        plannedCumulative += parseFloat(t.percent);
                    } else if (pTime > tStart) {
                        const elapsed = pTime - tStart;
                        const duration = tEnd - tStart;
                        plannedCumulative += parseFloat(t.percent) * (elapsed / duration);
                    }
                    
                    // Cumulative Actual Progress
                    if (t.status === 'Completed' && t.actualDate) {
                        const actEnd = new Date(t.actualDate).getTime();
                        if (pTime >= actEnd) {
                            actualCumulative += parseFloat(t.percent);
                        }
                    }
                });
                
                const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                const dp = {
                    name: `${thaiMonths[currMonth]} ${currYear + 543 - 2500}`,
                    timestamp: pTime,
                    "แผนงาน (%)": parseFloat(plannedCumulative.toFixed(2))
                };
                
                // Only show actual plot up to the reference current date
                if (pTime <= currentContext || (pTime - currentContext) < 30 * 24 * 3600 * 1000) {
                    dp["ผลงานจริง (%)"] = parseFloat(actualCumulative.toFixed(2));
                }
                
                points.push(dp);
                
                currMonth++;
                if (currMonth > 11) {
                    currMonth = 0;
                    currYear++;
                }
            }
            return points;
        };

        const Dashboard = () => {
            const { useState, useEffect, useMemo } = React;

            // Authentication State
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');

            // Data State
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('coopSettings_v3');
                return saved ? JSON.parse(saved) : initialSettings;
            });

            const [tasks, setTasks] = useState(() => {
                const saved = localStorage.getItem('coopTasks_v3');
                return saved ? JSON.parse(saved) : initialTasks;
            });

            useEffect(() => {
                localStorage.setItem('coopSettings_v3', JSON.stringify(settings));
                localStorage.setItem('coopTasks_v3', JSON.stringify(tasks));
            }, [settings, tasks]);

            // Derived Data
            const projStart = new Date(Math.min(...tasks.map(t => new Date(t.startDate).getTime())));
            const projEnd = new Date(Math.max(...tasks.map(t => new Date(t.endDate).getTime())));
            const today = new Date(settings.currentDate);

            // Added + 1 to include both start and end dates inclusively (730 days instead of 729)
            const durationDays = Math.max(1, Math.ceil((projEnd - projStart) / (1000 * 60 * 60 * 24)) + 1);
            
            // Adjusted daysPassed to also be inclusive if it's past the start date
            const daysPassed = Math.max(0, Math.ceil((today - projStart) / (1000 * 60 * 60 * 24)) + (today >= projStart ? 1 : 0));
            const daysRemaining = Math.max(0, durationDays - daysPassed);
            const timeProgress = Math.min(100, Math.max(0, (daysPassed / durationDays) * 100));

            const workProgress = tasks.filter(t => t.status === 'Completed').reduce((acc, t) => acc + parseFloat(t.percent), 0);
            const paidAmount = (workProgress / 100) * settings.budget;
            const remainingAmount = settings.budget - paidAmount;

            const chartData = useMemo(() => generateChartData(tasks, settings.currentDate), [tasks, settings.currentDate]);

            // Handlers
            const handleLogin = (e) => {
                e.preventDefault();
                if (username === 'admin' && password === 'admin') {
                    setIsAdmin(true);
                    setShowLogin(false);
                    setUsername('');
                    setPassword('');
                } else {
                    alert("Username หรือ Password ไม่ถูกต้อง!");
                }
            };

            const handleTaskChange = (index, field, value) => {
                if (!isAdmin) return;
                const newTasks = [...tasks];
                newTasks[index][field] = value;
                
                if (field === 'percent') {
                    newTasks[index].amount = (parseFloat(value || 0) / 100) * settings.budget;
                }
                
                if (field === 'status' && value === 'Completed' && !newTasks[index].actualDate) {
                    newTasks[index].actualDate = settings.currentDate;
                } else if (field === 'status' && value === 'Pending') {
                    newTasks[index].actualDate = '';
                }
                
                setTasks(newTasks);
            };

            const resetData = () => {
                if(window.confirm('คุณต้องการรีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเริ่มต้นหรือไม่? (เฉพาะ Admin)')) {
                    setSettings(initialSettings);
                    setTasks(initialTasks);
                }
            };

            return (
                <div className="min-h-screen pb-10 relative">
                    {/* Login Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 backdrop-blur-sm transition-opacity">
                            <div className="bg-white p-8 rounded-2xl shadow-2xl w-96 max-w-[90%] transform transition-all">
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                                        <i className="fa-solid fa-user-lock"></i>
                                    </div>
                                    <h2 className="text-2xl font-bold text-gray-800">Admin Login</h2>
                                    <p className="text-sm text-gray-500">สำหรับแก้ไขข้อมูล GANTT & S-Curve</p>
                                </div>
                                <form onSubmit={handleLogin}>
                                    <div className="mb-4">
                                        <label className="block text-sm font-semibold mb-1 text-gray-700">Username</label>
                                        <div className="relative">
                                            <i className="fa-solid fa-user absolute left-3 top-3 text-gray-400"></i>
                                            <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="w-full border border-gray-300 rounded-lg py-2 pl-10 pr-3 focus:ring-2 focus:ring-blue-500 outline-none" required />
                                        </div>
                                    </div>
                                    <div className="mb-6">
                                        <label className="block text-sm font-semibold mb-1 text-gray-700">Password</label>
                                        <div className="relative">
                                            <i className="fa-solid fa-lock absolute left-3 top-3 text-gray-400"></i>
                                            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border border-gray-300 rounded-lg py-2 pl-10 pr-3 focus:ring-2 focus:ring-blue-500 outline-none" required />
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-3">
                                        <button type="button" onClick={() => setShowLogin(false)} className="px-4 py-2 font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">ยกเลิก</button>
                                        <button type="submit" className="px-6 py-2 font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-md">เข้าสู่ระบบ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <div className="gradient-bg text-white pt-8 pb-20 px-6 sm:px-10 shadow-lg relative">
                        {/* Auth Button */}
                        <div className="absolute top-4 right-4 sm:top-6 sm:right-10 z-10">
                            {isAdmin ? (
                                <div className="flex items-center gap-3 bg-white/10 px-4 py-2 rounded-full backdrop-blur-md border border-white/20 shadow-inner">
                                    <span className="text-sm font-medium text-green-300"><i className="fa-solid fa-shield-check mr-1"></i> Mode Admin</span>
                                    <div className="w-px h-4 bg-white/30"></div>
                                    <button onClick={() => setIsAdmin(false)} className="text-sm text-red-300 hover:text-red-200 transition-colors">
                                        <i className="fa-solid fa-sign-out-alt mr-1"></i> ออกจากระบบ
                                    </button>
                                </div>
                            ) : (
                                <button onClick={() => setShowLogin(true)} className="text-sm bg-white/10 hover:bg-white/20 px-5 py-2 rounded-full backdrop-blur-md border border-white/20 transition-all shadow-lg font-medium flex items-center gap-2">
                                    <i className="fa-solid fa-lock text-blue-200"></i> แก้ไขข้อมูล (Admin)
                                </button>
                            )}
                        </div>

                        <div className="max-w-7xl mx-auto mt-4">
                            <p className="text-blue-200 text-sm font-medium tracking-wider mb-2 flex items-center gap-2">
                                <i className="fa-solid fa-chart-pie"></i> ระบบติดตามความก้าวหน้าโครงการ (S-Curve & GANTT)
                            </p>
                            <h1 className="text-2xl md:text-3xl lg:text-4xl font-bold leading-tight max-w-4xl">{settings.projectName}</h1>
                            <div className="mt-4 flex flex-wrap items-center gap-4 text-blue-100 text-sm">
                                <span className="flex items-center gap-1.5">
                                    <i className="fa-solid fa-building"></i> {settings.contractor}
                                </span>
                                <span className="flex items-center gap-1.5 bg-blue-800/40 px-3 py-1 rounded-full border border-blue-400/20">
                                    <i className="fa-solid fa-file-contract"></i> สัญญาเลขที่ {settings.contractNo}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 -mt-10 space-y-6">
                        
                        {/* Admin Settings Panel */}
                        {isAdmin && (
                            <div className="bg-white rounded-xl p-6 shadow-xl border-t-4 border-blue-500 animate-fade-in relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
                                    <i className="fa-solid fa-cog text-9xl"></i>
                                </div>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-lg font-bold text-blue-800 flex items-center gap-2">
                                        <i className="fa-solid fa-sliders text-blue-500"></i> ตั้งค่าข้อมูลหลัก (Admin Mode)
                                    </h2>
                                    <button onClick={resetData} className="text-xs bg-red-50 text-red-600 hover:bg-red-100 px-3 py-1.5 rounded border border-red-200 transition">
                                        <i className="fa-solid fa-rotate-left mr-1"></i> รีเซ็ตค่าเริ่มต้น
                                    </button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5 text-sm relative z-10">
                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-1">งบประมาณรวม (บาท)</label>
                                        <input type="number" value={settings.budget} onChange={e=>setSettings({...settings, budget: e.target.value})} className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-1">วงเงินค้ำประกัน (บาท)</label>
                                        <input type="number" value={settings.guarantee} onChange={e=>setSettings({...settings, guarantee: e.target.value})} className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-gray-700 font-semibold mb-1">ค่าปรับต่อวัน (บาท)</label>
                                        <input type="number" value={settings.penaltyPerDay} onChange={e=>setSettings({...settings, penaltyPerDay: e.target.value})} className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-400 outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-blue-700 font-bold mb-1">วันที่ประเมินผล (Current Date)</label>
                                        <input type="date" value={settings.currentDate} onChange={e=>setSettings({...settings, currentDate: e.target.value})} className="w-full border-2 border-blue-300 bg-blue-50 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-900" />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Summary Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="glass-card rounded-xl p-6 relative overflow-hidden group">
                                <div className="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity"><i className="fa-solid fa-wallet text-9xl"></i></div>
                                <p className="text-sm text-gray-500 font-medium mb-1">งบประมาณรวม (ค่าจ้าง)</p>
                                <p className="text-2xl font-bold text-gray-800 mb-4">{formatCurrency(settings.budget)}</p>
                                <div className="pt-4 border-t border-gray-100 flex justify-between text-sm">
                                    <span className="text-gray-500">ค่าปรับวันละ</span>
                                    <span className="font-medium text-red-500">{formatCurrency(settings.penaltyPerDay)}</span>
                                </div>
                            </div>
                            <div className="glass-card rounded-xl p-6 border-b-4 border-b-green-500 relative overflow-hidden group">
                                <div className="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity"><i className="fa-solid fa-money-bill-wave text-9xl text-green-500"></i></div>
                                <div className="flex justify-between items-end mb-1">
                                    <p className="text-sm text-gray-500 font-medium">เบิกจ่ายแล้ว</p>
                                    <span className="text-lg font-bold text-green-600">{workProgress}%</span>
                                </div>
                                <p className="text-2xl font-bold text-gray-800 mb-3">{formatCurrency(paidAmount)}</p>
                                <div className="w-full bg-gray-200 rounded-full h-2">
                                    <div className="bg-green-500 h-2 rounded-full transition-all duration-1000" style={{ width: `${workProgress}%` }}></div>
                                </div>
                            </div>
                            <div className="glass-card rounded-xl p-6 border-b-4 border-b-orange-400 relative overflow-hidden group">
                                <div className="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity"><i className="fa-solid fa-piggy-bank text-9xl text-orange-500"></i></div>
                                <div className="flex justify-between items-end mb-1">
                                    <p className="text-sm text-gray-500 font-medium">คงเหลือ</p>
                                    <span className="text-lg font-bold text-orange-500">{100 - workProgress}%</span>
                                </div>
                                <p className="text-2xl font-bold text-gray-800 mb-4">{formatCurrency(remainingAmount)}</p>
                                <div className="pt-4 border-t border-gray-100 flex justify-between text-sm">
                                    <span className="text-gray-500">วงเงินค้ำประกัน</span>
                                    <span className="font-medium text-gray-700">{formatCurrency(settings.guarantee)}</span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            {/* Time Summary */}
                            <div className="lg:col-span-1 glass-card rounded-xl p-6 flex flex-col justify-center">
                                <h2 className="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">
                                    <i className="fa-regular fa-clock text-blue-600"></i> ไทม์ไลน์โครงการ
                                </h2>
                                <div className="space-y-6">
                                    <div>
                                        <div className="flex justify-between text-sm mb-2">
                                            <span className="font-semibold text-blue-600">เวลาผ่านไปแล้ว ({timeProgress.toFixed(1)}%)</span>
                                            <span className="text-gray-500 text-xs">รวม {durationDays} วัน</span>
                                        </div>
                                        <div className="w-full bg-gray-200 rounded-full h-3 mb-1 overflow-hidden shadow-inner">
                                            <div className="bg-gradient-to-r from-blue-400 to-blue-600 h-3 rounded-full transition-all duration-1000 relative" style={{ width: `${timeProgress}%` }}>
                                                {timeProgress > 10 && <div className="absolute right-1 top-0 bottom-0 w-1 bg-white/40 rounded"></div>}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 text-center">
                                        <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                                            <p className="text-xs text-gray-500 mb-1">ผ่านมาแล้ว</p>
                                            <p className="font-bold text-2xl text-blue-600">{daysPassed} <span className="text-sm font-normal">วัน</span></p>
                                        </div>
                                        <div className="bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                                            <p className="text-xs text-gray-500 mb-1">เหลือเวลา</p>
                                            <p className="font-bold text-2xl text-orange-500">{daysRemaining} <span className="text-sm font-normal">วัน</span></p>
                                        </div>
                                    </div>
                                    <div className="text-sm bg-gray-50 rounded-lg p-3 border border-gray-100">
                                        <div className="flex justify-between mb-1">
                                            <span className="text-gray-500">เริ่มต้น:</span>
                                            <span className="font-medium text-gray-800">{formatThaiDate(projStart)}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-gray-500">สิ้นสุด (กำหนด):</span>
                                            <span className="font-medium text-gray-800">{formatThaiDate(projEnd)}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* S-Curve Chart */}
                            <div className="lg:col-span-2 glass-card rounded-xl p-6">
                                <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                    <i className="fa-solid fa-chart-area text-indigo-600"></i> S-Curve (แผนงาน vs ผลงานจริง)
                                </h2>
                                <div className="w-full h-[350px]">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={chartData} margin={{ top: 20, right: 20, left: -20, bottom: 0 }}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e2e8f0" />
                                            <XAxis dataKey="name" stroke="#64748b" style={{ fontSize: '12px', fontFamily: 'Sarabun' }} dy={10} />
                                            <YAxis domain={[0, 100]} stroke="#64748b" style={{ fontSize: '12px', fontFamily: 'Sarabun' }} unit="%" />
                                            <Tooltip 
                                                contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 10px 15px -3px rgba(0,0,0,0.1)', fontFamily: 'Sarabun' }}
                                                itemStyle={{ fontWeight: '600' }}
                                            />
                                            <Legend wrapperStyle={{ paddingTop: '20px', fontFamily: 'Sarabun' }} />
                                            <Line type="monotone" name="แผนงาน (%)" dataKey="แผนงาน (%)" stroke="#3b82f6" strokeWidth={3.5} dot={{ r: 0 }} activeDot={{ r: 6 }} />
                                            <Line type="monotone" name="ผลงานจริง (%)" dataKey="ผลงานจริง (%)" stroke="#ef4444" strokeWidth={3.5} dot={{ r: 0 }} activeDot={{ r: 6 }} />
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>

                        {/* Editable Gantt Table */}
                        <div className="glass-card rounded-xl overflow-hidden shadow-sm">
                            <div className="p-5 border-b border-gray-100 bg-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                    <i className="fa-solid fa-tasks text-teal-600"></i> ตารางความคืบหน้ารายงวด (Gantt Data)
                                </h2>
                                {isAdmin && (
                                    <span className="text-xs font-semibold bg-blue-100 text-blue-700 px-3 py-1 rounded-full animate-pulse">
                                        โหมดแก้ไขเปิดใช้งาน
                                    </span>
                                )}
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[1000px]">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b">
                                            <th className="p-4 font-semibold text-center w-12">งวดที่</th>
                                            <th className="p-4 font-semibold text-center w-16">วัน (สะสม)</th>
                                            <th className="p-4 font-semibold w-24">สัดส่วน (%)</th>
                                            <th className="p-4 font-semibold text-center w-24">รวม (%)</th>
                                            <th className="p-4 font-semibold">ยอดเงิน (บาท)</th>
                                            <th className="p-4 font-semibold">วันเริ่มต้น</th>
                                            <th className="p-4 font-semibold">วันสิ้นสุด (กำหนด)</th>
                                            <th className="p-4 font-semibold text-center">สถานะ</th>
                                            <th className="p-4 font-semibold">วันที่ส่งมอบจริง</th>
                                            <th className="p-4 font-semibold text-center w-24">จน.วันส่งงวดงาน</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-sm text-gray-700">
                                        {tasks.map((item, index) => {
                                            const isOverdue = item.status === 'Pending' && new Date(item.endDate) < new Date(settings.currentDate);
                                            // Calculate cumulative percent up to the current index
                                            const cumulativePercent = tasks.slice(0, index + 1).reduce((acc, curr) => acc + parseFloat(curr.percent || 0), 0);
                                            
                                            return (
                                                <tr key={index} className={`border-b transition-colors ${item.status === 'Completed' ? 'bg-green-50/20' : 'hover:bg-gray-50'} ${isAdmin ? 'hover:bg-blue-50/30' : ''}`}>
                                                    <td className="p-3 font-medium text-gray-900 text-center">{item.period}</td>
                                                    
                                                    {/* Editable Plan Days */}
                                                    <td className="p-3 text-center">
                                                        {isAdmin ? (
                                                            <input type="number" value={item.planDays || ''} onChange={e=>handleTaskChange(index, 'planDays', e.target.value)} className="w-16 border border-blue-300 rounded p-1 text-center font-medium text-blue-700 bg-white focus:ring-2 focus:ring-blue-400 outline-none" placeholder="-" />
                                                        ) : (
                                                            <span className="font-semibold text-blue-700">{item.planDays || '-'}</span>
                                                        )}
                                                    </td>

                                                    {/* Editable Percent */}
                                                    <td className="p-3">
                                                        {isAdmin ? (
                                                            <input type="number" min="0" max="100" value={item.percent} onChange={e=>handleTaskChange(index, 'percent', e.target.value)} className="w-16 border border-blue-300 rounded p-1 text-center font-semibold bg-white focus:ring-2 focus:ring-blue-400 outline-none" />
                                                        ) : (
                                                            <span className="font-medium text-gray-800">{item.percent}%</span>
                                                        )}
                                                    </td>
                                                    
                                                    {/* Calculated Cumulative Percent */}
                                                    <td className="p-3 text-center">
                                                        <span className="font-semibold text-red-500">{cumulativePercent}%</span>
                                                    </td>
                                                    
                                                    <td className="p-3 font-medium text-gray-600">{formatCurrency(item.amount).replace('฿', '')}</td>
                                                    
                                                    {/* Editable Start Date */}
                                                    <td className="p-3">
                                                        {isAdmin ? (
                                                            <input type="date" value={item.startDate} onChange={e=>handleTaskChange(index, 'startDate', e.target.value)} className="w-full border border-blue-300 rounded p-1 text-xs bg-white focus:ring-2 focus:ring-blue-400 outline-none" />
                                                        ) : (
                                                            <span>{formatThaiDate(item.startDate)}</span>
                                                        )}
                                                    </td>
                                                    
                                                    {/* Editable End Date */}
                                                    <td className="p-3">
                                                        {isAdmin ? (
                                                            <input type="date" value={item.endDate} onChange={e=>handleTaskChange(index, 'endDate', e.target.value)} className={`w-full border rounded p-1 text-xs bg-white focus:ring-2 focus:ring-blue-400 outline-none ${isOverdue ? 'border-red-400 text-red-600 font-medium' : 'border-blue-300'}`} />
                                                        ) : (
                                                            <span className={isOverdue ? 'text-red-500 font-semibold' : ''}>{formatThaiDate(item.endDate)}</span>
                                                        )}
                                                    </td>

                                                    {/* Editable Status */}
                                                    <td className="p-3 text-center">
                                                        {isAdmin ? (
                                                            <select value={item.status} onChange={e=>handleTaskChange(index, 'status', e.target.value)} className={`border rounded p-1 text-xs font-semibold outline-none focus:ring-2 ${item.status==='Completed' ? 'bg-green-100 text-green-800 border-green-300' : 'bg-gray-100 text-gray-700 border-gray-300'}`}>
                                                                <option value="Pending">รอดำเนินการ</option>
                                                                <option value="Completed">ส่งมอบแล้ว</option>
                                                            </select>
                                                        ) : (
                                                            item.status === 'Completed' ? 
                                                            <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded text-xs font-medium bg-green-100 text-green-800"><i className="fa-solid fa-check-circle"></i> ส่งแล้ว</span> : 
                                                            <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded text-xs font-medium bg-gray-100 text-gray-600"><i className="fa-regular fa-clock"></i> รอส่ง</span>
                                                        )}
                                                    </td>
                                                    
                                                    {/* Editable Actual Date */}
                                                    <td className="p-3">
                                                        {isAdmin ? (
                                                            <input type="date" value={item.actualDate} onChange={e=>handleTaskChange(index, 'actualDate', e.target.value)} disabled={item.status !== 'Completed'} className={`w-full border rounded p-1 text-xs focus:ring-2 focus:ring-blue-400 outline-none ${item.status==='Completed' ? 'bg-white border-blue-300' : 'bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed'}`} />
                                                        ) : (
                                                            <span className={item.status==='Completed' ? 'text-green-700 font-medium' : 'text-gray-400'}>{item.actualDate ? formatThaiDate(item.actualDate) : '-'}</span>
                                                        )}
                                                    </td>

                                                    {/* Editable Actual Days (จำนวนวันส่งงวดงาน) */}
                                                    <td className="p-3 text-center">
                                                        {isAdmin ? (
                                                            <input type="number" value={item.actualDays || ''} onChange={e=>handleTaskChange(index, 'actualDays', e.target.value)} disabled={item.status !== 'Completed'} className={`w-16 border rounded p-1 text-center text-sm focus:ring-2 focus:ring-blue-400 outline-none ${item.status==='Completed' ? 'bg-white border-blue-300 text-gray-900 font-medium' : 'bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed'}`} placeholder="-" />
                                                        ) : (
                                                            <span className={item.status==='Completed' ? 'text-gray-900 font-medium' : 'text-gray-400'}>{item.actualDays || '-'}</span>
                                                        )}
                                                    </td>
                                                </tr>
                                            )
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
